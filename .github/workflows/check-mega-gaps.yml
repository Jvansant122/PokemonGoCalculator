name: Mega/primal roster health check

# Advisory-only, read-only check. This workflow NEVER commits/pushes to
# data/, NEVER modifies scripts/sync-data.ts or any other source, and can
# never block/fail the deploy workflow (deploy.yml) — it is entirely
# separate infrastructure.
#
# This is a roster HEALTH check, not just a Bulbapedia diff, because a
# single absence-only comparison has a proven blind spot. It runs THREE
# independent findings, all folded into one tracking issue:
#
#   1. MISSING species (scripts/check-mega-gaps.ts) — a real, released
#      Mega/Primal that Bulbapedia confirms exists but this project's roster
#      doesn't have AT ALL. Can only ever fire after the damage is done.
#
#   2. FRAGILE species (scripts/check-mega-gates.ts) — a Mega/Primal that IS
#      currently present but is carried ONLY by the live-raid gate, with no
#      durable backing (pogoapi's mega_pokemon.json roster or the
#      hand-curated RELEASED_MEGA_PRIMAL_ALLOWLIST). Guaranteed to silently
#      vanish the moment its raid rotation ends — this is what actually
#      happened to Mega Mewtwo Y and Mega Skarmory on 2026-09-07, and is
#      detectable WHILE the species is still present rather than only after
#      it's gone. See that script's own header comment for the full
#      incident writeup.
#
#   3. STALE committed data — both checks above are run TWICE: once against
#      whatever data/normalized/species.json etc. happen to be committed
#      right now, and once against a freshly-synced copy produced by
#      `npm run sync-data` in the runner's own throwaway working copy (never
#      committed). Nothing else in this repo schedules a sync, so committed
#      data can silently drift arbitrarily far from live reality — a clean
#      committed-data run proves nothing on its own. A disagreement between
#      the two runs (a gap or a fragile species the fresh run sees that the
#      committed run doesn't, or vice versa) IS the finding: it means the
#      committed data was masking or misreporting something real.
#
# The sync-data step degrades gracefully: if it fails (e.g. an upstream
# source is unreachable), the fresh-data half is reported as incomplete
# rather than the job failing in a way that reads as "no gap found" — the
# committed-data half is still fully reported either way.
#
# Runs daily (bumped from weekly 2026-09-07 — see above: nothing else in
# this repo keeps committed data fresh, so a longer gap between runs is a
# longer blind-spot window). workflow_dispatch retained for on-demand runs.

on:
  schedule:
    # Daily at 13:00 UTC. A scheduled Actions cron is best-effort anyway
    # (GitHub may delay it under load).
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ---- Pass 1: against the data/ that's actually committed right now ----

      - name: Run mega/primal gap check (committed data)
        id: gap_committed
        run: npm run check-mega-gaps
        continue-on-error: true

      # continue-on-error on every preserve step: if a check crashed hard
      # enough not to write its report at all, this cp fails, and WITHOUT this
      # the job would abort right here — before the "Build combined
      # roster-health report" step whose whole job is to notice a missing
      # report and call it a broken check rather than "no gap found". That
      # step already handles a null report; it just has to be allowed to run.
      - name: Preserve committed-data gap report
        run: cp "$RUNNER_TEMP/mega-gap-report.json" "$RUNNER_TEMP/committed-mega-gap-report.json"
        continue-on-error: true

      - name: Run mega/primal gate-provenance audit (committed data)
        id: gate_committed
        run: npm run check-mega-gates
        continue-on-error: true

      - name: Preserve committed-data gate report
        run: cp "$RUNNER_TEMP/mega-gate-report.json" "$RUNNER_TEMP/committed-mega-gate-report.json"
        continue-on-error: true

      # ---- Pass 2: against a freshly-synced copy, never committed ----

      # Both passes write to the SAME $RUNNER_TEMP/mega-*-report.json paths.
      # Without deleting the committed pass's originals here, a fresh check
      # that crashed before writing would leave the committed report sitting
      # at that path, and the fresh "preserve" step would faithfully copy it
      # as the fresh result — making the reconciler compare committed against
      # committed, find them identical, and report NO staleness. That false
      # clean is exactly the "looks correct right now" failure this whole
      # health check exists to eliminate, so the files have to be gone before
      # pass 2 runs: a missing fresh report must read as "incomplete", never
      # as "agrees with committed".
      - name: Clear shared report paths before the fresh pass
        run: rm -f "$RUNNER_TEMP/mega-gap-report.json" "$RUNNER_TEMP/mega-gate-report.json"

      - name: Sync fresh data into the runner's throwaway working copy
        id: sync_data
        run: npm run sync-data
        continue-on-error: true

      - name: Run mega/primal gap check (freshly-synced data)
        id: gap_fresh
        if: steps.sync_data.outcome == 'success'
        run: npm run check-mega-gaps
        continue-on-error: true

      - name: Preserve fresh-data gap report
        if: steps.sync_data.outcome == 'success'
        run: cp "$RUNNER_TEMP/mega-gap-report.json" "$RUNNER_TEMP/fresh-mega-gap-report.json"
        continue-on-error: true

      - name: Run mega/primal gate-provenance audit (freshly-synced data)
        id: gate_fresh
        if: steps.sync_data.outcome == 'success'
        run: npm run check-mega-gates
        continue-on-error: true

      - name: Preserve fresh-data gate report
        if: steps.sync_data.outcome == 'success'
        run: cp "$RUNNER_TEMP/mega-gate-report.json" "$RUNNER_TEMP/fresh-mega-gate-report.json"
        continue-on-error: true

      # This workflow never commits anything — the sync above only ever
      # touches this runner's disposable filesystem, confirmed advisory by
      # `permissions: contents: read` at the top of this file.

      - name: Build combined roster-health report
        id: health
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const tempDir = process.env.RUNNER_TEMP;

            function readReport(name) {
              const p = path.join(tempDir, name);
              if (!fs.existsSync(p)) return null;
              return JSON.parse(fs.readFileSync(p, 'utf-8'));
            }

            const committedGap = readReport('committed-mega-gap-report.json');
            const committedGate = readReport('committed-mega-gate-report.json');
            const freshGap = readReport('fresh-mega-gap-report.json');
            const freshGate = readReport('fresh-mega-gate-report.json');
            const syncOutcome = '${{ steps.sync_data.outcome }}';
            const freshAvailable = syncOutcome === 'success' && freshGap !== null && freshGate !== null;

            if (!committedGap || !committedGate) {
              core.setFailed('One or both committed-data checks did not produce a report — treat as a broken check, not "no gap found".');
              core.setOutput('hasFindings', 'true');
              core.setOutput('broken', 'true');
              return;
            }

            let broken = false;
            const brokenReasons = [];
            const missingSpeciesFindings = [];
            const fragileSpeciesFindings = [];
            const staleFindings = [];

            if (committedGap.status === 'error') {
              broken = true;
              brokenReasons.push(`Committed-data Bulbapedia gap check failed: ${committedGap.error}`);
            } else if (committedGap.gapCount > 0) {
              missingSpeciesFindings.push({ source: 'committed', report: committedGap });
            }

            if (committedGate.status === 'error') {
              broken = true;
              brokenReasons.push(`Committed-data gate-provenance audit failed: ${committedGate.error}`);
            } else if (committedGate.liveRaidOnlyCount > 0) {
              fragileSpeciesFindings.push({ source: 'committed', report: committedGate });
            }

            if (!freshAvailable) {
              const reasonParts = [`sync-data outcome: ${syncOutcome}`];
              if (syncOutcome === 'success' && freshGap === null) reasonParts.push('no fresh gap report produced');
              if (syncOutcome === 'success' && freshGate === null) reasonParts.push('no fresh gate report produced');
              staleFindings.push(
                `Fresh-data half could not complete this run (${reasonParts.join(', ')}) — only the committed-data half could be verified. This is a degraded run, not a confirmed all-clear for freshly-synced reality.`,
              );
            } else {
              if (freshGap.status === 'error') {
                broken = true;
                brokenReasons.push(`Fresh-data Bulbapedia gap check failed: ${freshGap.error}`);
              } else if (freshGap.gapCount > 0) {
                missingSpeciesFindings.push({ source: 'fresh', report: freshGap });
              }

              if (freshGate.status === 'error') {
                broken = true;
                brokenReasons.push(`Fresh-data gate-provenance audit failed: ${freshGate.error}`);
              } else if (freshGate.liveRaidOnlyCount > 0) {
                fragileSpeciesFindings.push({ source: 'fresh', report: freshGate });
              }

              if (committedGap.status === 'ok' && freshGap.status === 'ok') {
                const committedNames = new Set((committedGap.gaps || []).map((g) => g.name));
                const freshNames = new Set((freshGap.gaps || []).map((g) => g.name));
                const onlyInFresh = [...freshNames].filter((n) => !committedNames.has(n));
                const onlyInCommitted = [...committedNames].filter((n) => !freshNames.has(n));
                if (onlyInFresh.length > 0 || onlyInCommitted.length > 0) {
                  staleFindings.push(
                    `Bulbapedia gap check disagrees between committed and freshly-synced data. Freshly-synced data shows a gap the committed data does NOT: ${onlyInFresh.join(', ') || 'none'}. Committed data shows a gap freshly-synced data does NOT: ${onlyInCommitted.join(', ') || 'none'}. Committed data is stale in a way that was masking or falsely reporting a gap.`,
                  );
                }
              }

              if (committedGate.status === 'ok' && freshGate.status === 'ok') {
                const committedNames = new Set((committedGate.liveRaidOnly || []).map((e) => e.name));
                const freshNames = new Set((freshGate.liveRaidOnly || []).map((e) => e.name));
                const onlyInFresh = [...freshNames].filter((n) => !committedNames.has(n));
                const onlyInCommitted = [...committedNames].filter((n) => !freshNames.has(n));
                if (onlyInFresh.length > 0 || onlyInCommitted.length > 0) {
                  staleFindings.push(
                    `Gate-provenance audit disagrees between committed and freshly-synced data. Freshly-synced data shows a fragile (live-raid-only) species the committed data does NOT: ${onlyInFresh.join(', ') || 'none'}. Committed data shows a fragile species freshly-synced data does NOT: ${onlyInCommitted.join(', ') || 'none'}. Committed data is stale.`,
                  );
                }
              }
            }

            const hasFindings = broken || missingSpeciesFindings.length > 0 || fragileSpeciesFindings.length > 0 || staleFindings.length > 0;

            core.setOutput('hasFindings', String(hasFindings));
            core.setOutput('broken', String(broken));
            core.setOutput(
              'summaryJson',
              JSON.stringify({
                committedGap,
                committedGate,
                freshGap,
                freshGate,
                freshAvailable,
                missingSpeciesFindings,
                fragileSpeciesFindings,
                staleFindings,
              }),
            );

            if (broken) {
              core.setFailed(brokenReasons.join(' | '));
            }

      - name: Create or update roster-health tracking issue
        if: steps.health.outputs.hasFindings == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const summary = JSON.parse('${{ steps.health.outputs.summaryJson }}');
            const label = 'mega-gap-check';

            const sections = [];

            sections.push(
              [
                'This project\'s mega/primal roster health check found one or more issues. This issue folds together THREE distinct kinds of finding — see scripts/check-mega-gaps.ts and scripts/check-mega-gates.ts for what each one means and why they\'re checked separately.',
              ].join('\n'),
            );

            if (summary.missingSpeciesFindings.length > 0) {
              const lines = summary.missingSpeciesFindings.map(({ source, report }) => {
                const gapLines = report.gaps.map((g) => `  - **${g.name}** — released ${g.releaseDate}`).join('\n');
                return `**${source === 'committed' ? 'Against committed data' : 'Against freshly-synced data'}** (checked ${report.checkedAt}, ${report.releasedCount} released per Bulbapedia vs. ${report.ownRosterCount} currently modeled):\n${gapLines}`;
              });
              sections.push(['## 1. Missing species (absence check vs Bulbapedia)', '', ...lines].join('\n'));
            }

            if (summary.fragileSpeciesFindings.length > 0) {
              const lines = summary.fragileSpeciesFindings.map(({ source, report }) => {
                const fragileLines = report.liveRaidOnly.map((e) => `  - **${e.name}** (id: \`${e.id}\`)`).join('\n');
                return `**${source === 'committed' ? 'Against committed data' : 'Against freshly-synced data'}** (checked ${report.checkedAt}, ${report.totalMegaPrimalCount} total mega/primal, ${report.megaPokemonJsonCount} durable via mega_pokemon.json, ${report.allowlistCount} durable via allowlist):\n${fragileLines}\n\n  These are in the roster ONLY because they are (or were, as of the check) a live raid boss and will silently disappear the moment that rotation ends — exactly what happened to Mega Mewtwo Y and Mega Skarmory on 2026-09-07. After human verification that each is genuinely released content, add it to \`RELEASED_MEGA_PRIMAL_ALLOWLIST\` in \`scripts/sync-data/releasedMegaPrimalAllowlist.ts\` with its own citation.`;
              });
              sections.push(['## 2. Fragile species (live-raid-only gate provenance)', '', ...lines].join('\n'));
            }

            if (summary.staleFindings.length > 0) {
              sections.push(['## 3. Stale committed data', '', ...summary.staleFindings.map((f) => `- ${f}`)].join('\n'));
            }

            sections.push(
              [
                '---',
                'This is advisory only — nothing has been auto-changed. A human should review each section above:',
                '- Missing species: add via the normal data-sync pipeline (`npm run sync-data`, extending its GAME_MASTER-fallback/allowlist mega-gap handling).',
                '- Fragile species: verify genuinely released, then add to `RELEASED_MEGA_PRIMAL_ALLOWLIST`.',
                '- Stale data: re-run `npm run sync-data` and commit the result once the underlying disagreement is understood.',
                '',
                'This issue is automatically updated by `.github/workflows/check-mega-gaps.yml` on its daily run and will be auto-closed once no findings remain.',
              ].join('\n'),
            );

            const body = sections.join('\n\n');

            const { data: existingIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });

            if (existingIssues.length > 0) {
              const issue = existingIssues[0];
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                title: 'Mega/primal roster health check findings',
                body,
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Health check re-run: still open — see updated issue body for current findings.`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Mega/primal roster health check findings',
                body,
                labels: [label],
              });
            }

      - name: Close stale roster-health issue if resolved
        if: steps.health.outputs.hasFindings == 'false'
        uses: actions/github-script@v9
        with:
          script: |
            const label = 'mega-gap-check';
            const { data: existingIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });

            for (const issue of existingIssues) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'This project\'s mega/primal roster health check found no missing species, no fragile (live-raid-only) species, and no disagreement between committed and freshly-synced data — closing automatically.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }
