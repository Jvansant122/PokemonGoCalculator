name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The same gate `npm run verify` runs locally: engine + web + scripts tests, both
  # type-checks, lint, the four check scripts, and the production build. Nothing reaches
  # Pages unless every one of them is green. On a pull_request this job is the whole
  # workflow (deploy is push-only).
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify (tests, type-checks, lint, checks, build)
        run: npm run verify
        env:
          GITHUB_PAGES: "true"

      # Playwright's Chromium download is the only step in this job that fetches from
      # somewhere other than the npm registry, and it is where run #43 (2026-09-09)
      # failed on a transient error with the verify step already green — the artifact
      # was sound, only the deploy was lost. Two layers of defence: the browser
      # binaries are cached per Playwright version, so the download only happens when
      # @playwright/test is bumped, and the install itself is retried. On a cache hit
      # `playwright install` finds the binaries and skips the download; --with-deps
      # still installs the OS libraries, which are not cached.
      - name: Resolve Playwright version
        id: playwright
        if: hashFiles('packages/web/playwright.config.ts') != ''
        run: |
          version="$(npx --workspace=packages/web playwright --version | awk '{print $2}')"
          if [ -z "$version" ]; then
            echo "::error::Could not resolve the installed Playwright version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: hashFiles('packages/web/playwright.config.ts') != ''
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        if: hashFiles('packages/web/playwright.config.ts') != ''
        run: |
          for attempt in 1 2 3; do
            if npx --workspace=packages/web playwright install --with-deps chromium; then
              exit 0
            fi
            echo "::warning::Playwright browser install attempt $attempt failed; retrying in $((attempt * 20))s"
            sleep $((attempt * 20))
          done
          echo "::error::Playwright browser install failed after 3 attempts"
          exit 1

      - name: Browser smoke tests
        if: hashFiles('packages/web/playwright.config.ts') != ''
        run: npm run test:e2e
        env:
          GITHUB_PAGES: "true"

      - name: Add .nojekyll
        run: touch packages/web/dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: packages/web/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
