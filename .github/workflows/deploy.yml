name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The same gate `npm run verify` runs locally: engine + web + scripts tests, both
  # type-checks, lint, the four check scripts, and the production build. Nothing reaches
  # Pages unless every one of them is green. On a pull_request this job is the whole
  # workflow (deploy is push-only).
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify (tests, type-checks, lint, checks, build)
        run: npm run verify
        env:
          GITHUB_PAGES: "true"

      - name: Install Playwright browsers
        if: hashFiles('packages/web/playwright.config.ts') != ''
        run: npx --workspace=packages/web playwright install --with-deps chromium

      - name: Browser smoke tests
        if: hashFiles('packages/web/playwright.config.ts') != ''
        run: npm run test:e2e
        env:
          GITHUB_PAGES: "true"

      - name: Add .nojekyll
        run: touch packages/web/dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: packages/web/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
